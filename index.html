              "@type": "Question",
              "name": "Why isn't outbound working anymore?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Buyers are buried in generic sequences, and spam filters are better than they were. Sending more mail does not fix that. Timing does. Signal-based pipeline watches for job changes, funding, hiring bursts, and tech installs, then starts outreach when the signal fires. ERA builds these systems for mid-market B2B companies and runs them with your team."

              "@type": "Question",
              "name": "Why do deals stall before they close?",

                "@type": "Answer",
                "text": "Usually you are talking to one person in a buying committee of many. ERA's Trust Loop works the champions, economic buyers, and influencers together. When a deal goes quiet, the system notices and reaches back out."

              "@type": "Question",
              "name": "How long does it take to build a pipeline from scratch?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Most customers see first results in months three and four. The first two months are infrastructure: signal setup, trigger logic, sequences, CRM. Outreach can go live by week three. Month ten should look different from month four because the loop has more signal history to work with."
              }
            },
            {
              "@type": "Question",
              "name": "What is the difference between a campaign and a loop?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "A campaign fires once and you measure after. A loop keeps running and updates when new signals arrive. A campaign ends when the budget ends. A loop does not; it gets more accurate as it runs."
              }
            },
            {
              "@type": "Question",
              "name": "What does ERA actually build and run?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "ERA sits between your market and your sellers. We catch buying signals across your accounts, send the right play to the right person when the timing is real, and run the loop with your team every week. Sellers walk into conversations that have been warming for weeks."
